name: Go verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go-tests:
    name: go-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -v ./...
      - run: go vet ./...
