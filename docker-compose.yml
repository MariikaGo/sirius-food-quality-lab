name: sirius-practice10
x-app: &app
  image: sirius-practice10:local
  build: .
  environment: &env
    DATABASE_URL: postgres://sirius:sirius@db:5432/sirius_practice10?sslmode=disable
    REDIS_ADDR: redis:6379
    HTTP_ADDR: 0.0.0.0:8000
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
    DEBUG: ${DEBUG:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    RABBITMQ_URL: amqp://sirius:${RABBITMQ_PASSWORD:?required}@rabbitmq:5672/
    GRPC_ADDR: delivery:50051
    SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required in .env}
    TASKS_MODE: ${TASKS_MODE:-async}
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_practice10
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_practice10"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    <<: *app
    command: ["sh", "-c", "./seed && exec ./api"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    command: ["./worker"]
    depends_on:
      api:
        condition: service_healthy
  scheduler:
    <<: *app
    command: ["./scheduler"]
    depends_on:
      api:
        condition: service_healthy
  delivery:
    <<: *app
    command: ["./delivery"]
    environment:
      <<: *env
      GRPC_ADDR: 0.0.0.0:50051
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    build: infra/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 40
  publisher:
    <<: *app
    command: ["./events", "publisher"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  kitchen:
    <<: *app
    command: ["./events", "kitchen"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  delivery-consumer:
    <<: *app
    command: ["./events", "delivery"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  compensation:
    <<: *app
    command: ["./events", "compensation"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.11.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:12.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
  jaeger:
    image: jaegertracing/jaeger:2.16.0
    ports:
      - "127.0.0.1:16686:16686"
volumes:
  pg_data:
  redis_data:
  rabbit_data:
